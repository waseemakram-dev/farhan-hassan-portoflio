# Netlify Configuration for Farhan Portfolio

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Redirects
[[redirects]]
  from = "/about"
  to = "/#about"
  status = 302
  force = true

[[redirects]]
  from = "/about/"
  to = "/#about"
  status = 302
  force = true

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 302
  force = true

[[redirects]]
  from = "/services/"
  to = "/#services"
  status = 302
  force = true

[[redirects]]
  from = "/service"
  to = "/#services"
  status = 302
  force = true

[[redirects]]
  from = "/service/"
  to = "/#services"
  status = 302
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/#portfolio"
  status = 302
  force = true

[[redirects]]
  from = "/portfolio/"
  to = "/#portfolio"
  status = 302
  force = true

[[redirects]]
  from = "/projects"
  to = "/#portfolio"
  status = 302
  force = true

[[redirects]]
  from = "/projects/"
  to = "/#portfolio"
  status = 302
  force = true

[[redirects]]
  from = "/blog"
  to = "/#blog"
  status = 302
  force = true

[[redirects]]
  from = "/blog/"
  to = "/#blog"
  status = 302
  force = true

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 302
  force = true

[[redirects]]
  from = "/contact/"
  to = "/#contact"
  status = 302
  force = true

# Asset Headers
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
